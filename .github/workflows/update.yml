name: Actualizar Sorteos

on:
  schedule:
    - cron: '0 8 * * *'  # Se ejecutará automáticamente todos los días a las 08:00
  workflow_dispatch:     # Permite lanzarlo manualmente desde GitHub cuando quieras

jobs:
  actualizar:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de descarga
        run: python scripts/update_draws.py

      - name: Guardar cambios y subir a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Actualizacion automatica local desde Espana" && git push)

