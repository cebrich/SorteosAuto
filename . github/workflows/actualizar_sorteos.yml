name: Actualizar Sorteos Automáticamente

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 08:00 UTC
  workflow_dispatch:     # Permite lanzarlo manualmente desde la pestaña "Actions" de GitHub cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Otorga permisos al bot para actualizar archivos en el repositorio
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar script de descarga
        run: |
          python scripts/update_draws.py

      - name: Guardar cambios en GitHub (Commit y Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "🤖 Actualización automática de listados de lotería" && git push)
          
